# One-off data fix — «تمرین ریاضی» (id 45) یک هفته عقب ثبت شده بود
# (بیلدِ قبلی تاریخ را از «امروز + اختلافِ روزِ هفته» می‌گرفت؛ جمعه ۲۷ نوامبر
# ثبت شد و شنبه روی ۲۱ نوامبر افتاد). این ورک‌فلو فقط همان یک ردیف را با
# شرطِ محافظه‌کارانه جابه‌جا می‌کند و بعدش حذف می‌شود.
name: One-off data fix (homework id45 date)
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Move homework id45 2026-11-21 -> 2026-11-28 (guarded UPDATE + verify)
        run: |
          npx --yes wrangler@4 d1 execute school_class_db --remote --command "UPDATE homework SET hw_date = '2026-11-28', updated_at = datetime('now') WHERE id = 45 AND hw_date = '2026-11-21' AND lesson_id = 21"
          npx --yes wrangler@4 d1 execute school_class_db --remote --command "SELECT id, lesson_id, hw_date, title, updated_at FROM homework ORDER BY hw_date"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
