/* ================================================================
   کلاس‌هاب — Pastel Slate Design System v3
   فونت‌ها: وزیرمتن (۷ وزن) + استعداد (تیترها)
   پالت: آبی فولادی #D9E4F2 · نیلی #D6DFF5 · سبزآبی #D8EEE9 ·
         کرم #F5EEDC · پس‌زمینه #FAFBFD · متن #2C3242
   ================================================================ */

/* ---------- فونت‌ها (زیرمجموعه‌شده برای اینترنت ضعیف) ---------- */
@font-face {
  font-family: 'Vazirmatn';
  src: url('/fonts/Vazirmatn-Regular.woff2') format('woff2');
  font-weight: 400 500; font-style: normal; font-display: swap;
}
@font-face {
  font-family: 'Vazirmatn';
  src: url('/fonts/Vazirmatn-SemiBold.woff2') format('woff2');
  font-weight: 600 700; font-style: normal; font-display: swap;
}
@font-face {
  font-family: 'Vazirmatn';
  src: url('/fonts/Vazirmatn-ExtraBold.woff2') format('woff2');
  font-weight: 800 900; font-style: normal; font-display: swap;
}
@font-face {
  font-family: 'Estedad';
  src: url('/fonts/Estedad-ExtraBold.woff2') format('woff2');
  font-weight: 700 800; font-style: normal; font-display: swap;
}

/* ---------- توکن‌ها ---------- */
:root {
  /* پالت پاستلی خنثی‌تر (steel blue / indigo / teal) */
  --lavender: #D9E4F2;   /* آبی فولادی (سابق: بنفش) */
  --pink: #F2DEDE;       /* رز خنثی (سابق: صورتی پررنگ) */
  --mint: #D8EEE9;       /* سبزآبی */
  --cream: #F5EEDC;      /* کرم */
  --blue: #D6DFF5;       /* نیلی */
  --green: #E2EFD8;      /* سبز زیتونی روشن */
  --bg: #FAFBFD;
  --text: #2C3242;
  --sub: #7C8496;
  --white: #FFFFFF;

  --lavender-deep: #4C6E9E;  /* آبی فولادی عمیق */
  --pink-deep: #B06A6A;      /* رز عمیق */
  --mint-deep: #3E8A7C;      /* تیال عمیق */
  --cream-deep: #A97F36;     /* خردلی عمیق */
  --blue-deep: #5566B0;      /* نیلی عمیق */
  --green-deep: #5F8A3C;     /* سبز عمیق */

  --surface: #FFFFFF;
  --surface-2: #F3F5F9;
  --surface-3: #EBEEF4;
  --border: #E4E8F0;
  --border-strong: #CBD3E1;

  /* تایپوگرافی سیال */
  --font-body: 'Vazirmatn', 'Segoe UI', Tahoma, sans-serif;
  --font-display: 'Estedad', 'Vazirmatn', 'Segoe UI', sans-serif;

  --fs-xs: clamp(10.5px, 0.5vw + 9px, 12px);
  --fs-sm: clamp(12px, 0.4vw + 10.5px, 13.5px);
  --fs-base: clamp(13.5px, 0.4vw + 12px, 15.5px);
  --fs-md: clamp(15px, 0.6vw + 12.5px, 17px);
  --fs-lg: clamp(18px, 1vw + 14px, 22px);
  --fs-xl: clamp(22px, 1.8vw + 16px, 30px);
  --fs-hero: clamp(28px, 3.2vw + 17px, 42px);

  /* گردی — کمی مرددتر */
  --radius-xs: 7px;
  --radius-sm: 10px;
  --radius-md: 13px;
  --radius-lg: 17px;
  --radius-xl: 22px;

  /* سایه‌های خاکستری-آبی */
  --shadow-xs: 0 1px 2px rgba(52, 66, 92, 0.06);
  --shadow-soft: 0 1px 2px rgba(52, 66, 92, 0.05), 0 8px 24px -6px rgba(52, 66, 92, 0.11);
  --shadow-hover: 0 2px 4px rgba(52, 66, 92, 0.07), 0 16px 40px -8px rgba(52, 66, 92, 0.17);
  --shadow-pop: 0 4px 8px rgba(52, 66, 92, 0.09), 0 24px 64px -12px rgba(52, 66, 92, 0.24);

  --ease-spring: cubic-bezier(0.34, 1.4, 0.64, 1);
  --ease-out: cubic-bezier(0.22, 0.9, 0.36, 1);
}

/* ---------- پایه ---------- */
* { box-sizing: border-box; }

/* اتریبیوت hidden باید همیشه بر display کلاس‌ها غلبه کند
   (بدون این، overlay های بسته با display:flex کل صفحه را می‌پوشانند و کلیک را می‌بلعند) */
[hidden] { display: none !important; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  direction: rtl;
  font-size: var(--fs-base);
  line-height: 1.8;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}

/* پس‌زمینه تزئینی: هاله‌های پاستلی خنثی + نقطه‌های ریز */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: -2;
  background-image:
    radial-gradient(circle at 12% 6%, rgba(217, 228, 242, 0.65) 0, transparent 30%),
    radial-gradient(circle at 88% 2%, rgba(214, 223, 245, 0.55) 0, transparent 26%),
    radial-gradient(circle at 96% 90%, rgba(216, 238, 233, 0.55) 0, transparent 28%),
    radial-gradient(circle at 3% 94%, rgba(245, 238, 220, 0.5) 0, transparent 26%);
  pointer-events: none;
}
body::after {
  content: '';
  position: fixed;
  inset: 0;
  z-index: -1;
  background-image: radial-gradient(rgba(76, 110, 158, 0.07) 1.2px, transparent 1.2px);
  background-size: 26px 26px;
  pointer-events: none;
  mask-image: linear-gradient(180deg, rgba(0,0,0,.5), rgba(0,0,0,.15) 40%, rgba(0,0,0,.4));
  -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,.5), rgba(0,0,0,.15) 40%, rgba(0,0,0,.4));
}

::selection { background: var(--lavender); color: var(--text); }

img { max-width: 100%; height: auto; }

a { color: var(--lavender-deep); text-decoration: none; }
a:hover { text-decoration: underline; }

button { font-family: inherit; }

h1, h2, h3, h4 { line-height: 1.5; }

/* ---------- اسکرول‌بار ---------- */
::-webkit-scrollbar { width: 10px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--border-strong);
  border-radius: 8px;
  border: 2px solid var(--bg);
}
::-webkit-scrollbar-thumb:hover { background: var(--lavender-deep); }

:focus-visible {
  outline: 3px solid rgba(76, 110, 158, 0.5);
  outline-offset: 2px;
  border-radius: 4px;
}

/* ================================================================
   هدر
   ================================================================ */
.site-header {
  position: sticky;
  top: 0;
  z-index: 60;
  background: rgba(252, 250, 253, 0.78);
  backdrop-filter: blur(18px) saturate(1.4);
  -webkit-backdrop-filter: blur(18px) saturate(1.4);
  border-bottom: 1px solid var(--border);
}

.site-header__inner {
  max-width: 1500px;
  margin: 0 auto;
  padding: 10px clamp(12px, 3vw, 32px);
  display: flex;
  align-items: center;
  gap: clamp(8px, 1.5vw, 16px);
}

.brand { display: flex; align-items: center; gap: 11px; min-width: 0; }

.brand__logo {
  width: clamp(42px, 3vw, 50px);
  height: clamp(42px, 3vw, 50px);
  border-radius: 15px;
  background: linear-gradient(135deg, var(--lavender) 0%, var(--pink) 100%);
  display: grid;
  place-items: center;
  font-size: clamp(20px, 1.6vw, 25px);
  box-shadow: var(--shadow-soft);
  flex-shrink: 0;
  position: relative;
  transition: transform 0.3s var(--ease-spring);
}
.brand__logo:hover { transform: rotate(-8deg) scale(1.06); }

.brand__logo::after {
  content: '';
  position: absolute;
  inset: -3px;
  border-radius: 18px;
  border: 2px dashed rgba(76, 110, 158, 0.4);
  opacity: 0;
  transition: opacity 0.3s;
}
.brand__logo:hover::after { opacity: 1; }

.brand__name {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(16px, 1.3vw, 20px);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.4;
}

.brand__date {
  font-size: var(--fs-xs);
  color: var(--sub);
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 6px;
}

.brand__clock {
  font-variant-numeric: tabular-nums;
  background: var(--surface-2);
  border-radius: 999px;
  padding: 1px 8px;
  font-weight: 600;
  color: var(--lavender-deep);
}

.header-spacer { flex: 1; }

.welcome-bubble {
  display: none;
  background: linear-gradient(135deg, var(--cream), #FBF6E9);
  border: 1px solid #E5D9B8;
  color: #77591F;
  border-radius: 999px;
  padding: 7px 18px;
  font-size: var(--fs-sm);
  max-width: 340px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  box-shadow: var(--shadow-xs);
}
.welcome-bubble::before {
  content: '☕';
  margin-inline-end: 6px;
}

@media (min-width: 1000px) { .welcome-bubble { display: block; } }

.header-actions { display: flex; align-items: center; gap: 9px; position: relative; }

.icon-btn {
  position: relative;
  width: clamp(40px, 3vw, 46px);
  height: clamp(40px, 3vw, 46px);
  border-radius: 14px;
  border: 1px solid var(--border);
  background: var(--surface);
  cursor: pointer;
  display: grid;
  place-items: center;
  font-size: clamp(17px, 1.2vw, 20px);
  color: var(--text);
  transition: transform 0.25s var(--ease-spring), box-shadow 0.25s, background 0.25s, border-color 0.25s;
  flex-shrink: 0;
}
.icon-btn:hover {
  background: var(--surface-2);
  border-color: var(--border-strong);
  box-shadow: var(--shadow-soft);
  transform: translateY(-2px);
}
.icon-btn:active { transform: scale(0.92); }

.icon-btn__badge {
  position: absolute;
  top: -5px;
  inset-inline-start: -5px;
  background: linear-gradient(135deg, var(--pink-deep), #C08080);
  color: #fff;
  font-size: 10.5px;
  font-weight: 800;
  min-width: 19px;
  height: 19px;
  padding: 0 5px;
  border-radius: 999px;
  display: grid;
  place-items: center;
  border: 2px solid var(--bg);
  animation: badge-pop 0.45s var(--ease-spring);
}

/* ================================================================
   چیدمان کلی
   ================================================================ */
.container {
  max-width: 1500px;
  margin: 0 auto;
  padding: clamp(14px, 2.5vw, 28px) clamp(12px, 3vw, 32px) 90px;
}

/* ---------- هیرو ---------- */
.page-hero {
  position: relative;
  margin: clamp(6px, 1.5vw, 18px) 0 clamp(18px, 2.5vw, 30px);
  background: linear-gradient(120deg, var(--lavender) 0%, var(--blue) 45%, var(--cream) 100%);
  border-radius: var(--radius-xl);
  padding: clamp(22px, 3.5vw, 42px) clamp(18px, 4vw, 48px);
  overflow: hidden;
  box-shadow: var(--shadow-soft);
}

.page-hero::before,
.page-hero::after {
  content: '';
  position: absolute;
  border-radius: 50%;
  filter: blur(2px);
  opacity: 0.55;
  pointer-events: none;
}
.page-hero::before {
  width: clamp(120px, 18vw, 240px);
  height: clamp(120px, 18vw, 240px);
  background: radial-gradient(circle, rgba(255,255,255,0.8), transparent 70%);
  top: -40%;
  inset-inline-start: 6%;
  animation: float-slow 7s ease-in-out infinite;
}
.page-hero::after {
  width: clamp(80px, 12vw, 160px);
  height: clamp(80px, 12vw, 160px);
  background: radial-gradient(circle, rgba(255,255,255,0.65), transparent 70%);
  bottom: -30%;
  inset-inline-end: 10%;
  animation: float-slow 9s ease-in-out infinite reverse;
}

.page-hero__title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: var(--fs-hero);
  margin: 0 0 6px;
  line-height: 1.45;
  color: #333B52;
  text-shadow: 0 1px 0 rgba(255,255,255,0.5);
  position: relative;
  z-index: 1;
}

.page-hero__sub {
  color: #5A6379;
  font-size: var(--fs-md);
  margin: 0;
  position: relative;
  z-index: 1;
}

/* چیپ‌های آمار هیرو */
.hero-stats {
  display: flex;
  flex-wrap: wrap;
  gap: clamp(8px, 1.2vw, 14px);
  margin-top: clamp(14px, 2vw, 22px);
  position: relative;
  z-index: 1;
}

.stat-chip {
  background: rgba(255, 255, 255, 0.82);
  backdrop-filter: blur(6px);
  border: 1px solid rgba(255, 255, 255, 0.9);
  border-radius: 999px;
  padding: 7px 18px;
  font-size: var(--fs-sm);
  font-weight: 600;
  color: #3E4A6B;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  box-shadow: var(--shadow-xs);
  animation: fade-up 0.5s var(--ease-out) both;
}
.stat-chip:nth-child(2) { animation-delay: 0.07s; }
.stat-chip:nth-child(3) { animation-delay: 0.14s; }
.stat-chip b {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.25em;
  color: var(--lavender-deep);
}

/* ---------- بخش‌ها ---------- */
.section { margin-top: clamp(30px, 4vw, 52px); }

.section__head {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: clamp(14px, 2vw, 20px);
  flex-wrap: wrap;
}

.section__title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: var(--fs-xl);
  margin: 0;
  display: flex;
  align-items: center;
  gap: 12px;
  color: #333B52;
}

.section__title .emoji {
  font-size: clamp(19px, 1.5vw, 24px);
  background: var(--surface);
  border: 1px solid var(--border);
  width: clamp(38px, 3vw, 46px);
  height: clamp(38px, 3vw, 46px);
  border-radius: 14px;
  display: inline-grid;
  place-items: center;
  box-shadow: var(--shadow-xs);
  flex-shrink: 0;
}

.section__note { color: var(--sub); font-size: var(--fs-xs); margin-inline-start: auto; }

/* ================================================================
   جدول هفتگی
   ================================================================ */
.tt-wrap { position: relative; }

/* لبه‌های محو برای نشان‌دادن امکان اسکرول */
.tt-scroll {
  overflow-x: auto;
  padding: 6px 2px 14px;
  -webkit-overflow-scrolling: touch;
  scroll-snap-type: x proximity;
  scrollbar-width: thin;
}

.tt-wrap--scrollable .tt-scroll {
  mask-image: linear-gradient(to left, transparent 0, #000 26px, #000 calc(100% - 26px), transparent 100%);
  -webkit-mask-image: linear-gradient(to left, transparent 0, #000 26px, #000 calc(100% - 26px), transparent 100%);
}
.tt-wrap--at-start .tt-scroll {
  mask-image: linear-gradient(to left, #000 0, #000 calc(100% - 26px), transparent 100%);
  -webkit-mask-image: linear-gradient(to left, #000 0, #000 calc(100% - 26px), transparent 100%);
}
.tt-wrap--at-end .tt-scroll {
  mask-image: linear-gradient(to left, transparent 0, #000 26px, #000 100%);
  -webkit-mask-image: linear-gradient(to left, transparent 0, #000 26px, #000 100%);
}

/* دسکتاپ بزرگ: هر ۷ روز کنار هم */
.tt-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: clamp(10px, 1.2vw, 16px);
  min-width: 100%;
}

/* زیر ۱۳۶۰px: ستون‌های ثابت + اسکرول افقی */
@media (max-width: 1359px) {
  .tt-grid { grid-template-columns: repeat(7, 252px); }
}
@media (max-width: 480px) {
  .tt-grid { grid-template-columns: repeat(7, min(86vw, 320px)); }
}

/* فلش‌های ناوبری */
.tt-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-58%);
  z-index: 20;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: 1px solid var(--border-strong);
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(8px);
  box-shadow: var(--shadow-hover);
  cursor: pointer;
  font-size: 20px;
  color: var(--lavender-deep);
  display: grid;
  place-items: center;
  transition: transform 0.25s var(--ease-spring), opacity 0.25s, background 0.25s;
  opacity: 0;
  pointer-events: none;
}
.tt-arrow--prev { inset-inline-end: 2px; }
.tt-arrow--next { inset-inline-start: 2px; }

.tt-wrap--scrollable:not(.tt-wrap--at-start) .tt-arrow--prev,
.tt-wrap--scrollable:not(.tt-wrap--at-end) .tt-arrow--next {
  opacity: 1;
  pointer-events: auto;
}
.tt-arrow:hover { background: var(--lavender); transform: translateY(-58%) scale(1.1); }
.tt-arrow:active { transform: translateY(-58%) scale(0.94); }

/* نقطه‌های راهنمای روز (موبایل/تبلت) */
.tt-dots {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-top: 4px;
}
.tt-dot {
  width: 9px;
  height: 9px;
  border-radius: 999px;
  border: none;
  padding: 0;
  background: var(--border-strong);
  cursor: pointer;
  transition: transform 0.25s var(--ease-spring), background 0.25s, width 0.25s;
}
.tt-dot--today { background: var(--lavender-deep); }
.tt-dot--active {
  width: 26px;
  background: linear-gradient(90deg, var(--lavender-deep), var(--blue-deep));
}
.tt-dot:hover { transform: scale(1.35); }

@media (min-width: 1360px) {
  .tt-dots { display: none; }
}

/* ---------- ستون روز ---------- */
.day-col {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: clamp(12px, 1vw, 16px) clamp(10px, 0.9vw, 14px) clamp(14px, 1.2vw, 18px);
  display: flex;
  flex-direction: column;
  gap: clamp(8px, 0.9vw, 11px);
  scroll-snap-align: start;
  min-height: clamp(280px, 30vw, 380px);
  transition: box-shadow 0.3s, border-color 0.3s, transform 0.3s;
  position: relative;
  overflow: hidden;
}

/* روبان بالای ستون امروز */
.day-col--today {
  border-color: rgba(138, 111, 184, 0.45);
  box-shadow: 0 0 0 3px rgba(217, 228, 242, 0.65), var(--shadow-soft);
  background:
    linear-gradient(180deg, rgba(217, 228, 242, 0.5), rgba(255, 255, 255, 0) 150px),
    var(--surface);
}
.day-col--today::before {
  content: '';
  position: absolute;
  top: 0;
  inset-inline: 0;
  height: 5px;
  background: linear-gradient(90deg, var(--lavender-deep), var(--blue-deep), var(--cream-deep));
  border-radius: 5px 5px 0 0;
}

.day-col__head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 6px;
  padding: 2px 4px 10px;
  border-bottom: 2px dashed var(--border);
  flex-wrap: wrap;
}

.day-col__name {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(15px, 1.1vw, 18px);
}

.day-col--today .day-col__name { color: var(--lavender-deep); }

.day-col__date {
  font-size: var(--fs-xs);
  color: var(--sub);
  white-space: nowrap;
}

.day-col__today-tag {
  background: linear-gradient(135deg, var(--lavender), var(--blue));
  color: #3E4A6B;
  font-size: 10.5px;
  font-weight: 800;
  padding: 3px 11px;
  border-radius: 999px;
  box-shadow: var(--shadow-xs);
}

/* ---------- کارت درس ---------- */
.lesson-card {
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: clamp(9px, 0.8vw, 12px) clamp(10px, 0.9vw, 13px);
  cursor: pointer;
  text-align: right;
  background: var(--surface);
  position: relative;
  transition: transform 0.25s var(--ease-out), box-shadow 0.25s, border-color 0.25s;
  font-family: inherit;
  width: 100%;
  display: block;
  color: var(--text);
  -webkit-tap-highlight-color: transparent;
}

.lesson-card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-hover);
  border-color: var(--border-strong);
  z-index: 2;
}
.lesson-card:active { transform: scale(0.97); }
.lesson-card:focus-visible { outline: 3px solid var(--lavender); outline-offset: 2px; }

.lesson-card__top {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 5px;
}

.lesson-card__emoji {
  width: 30px;
  height: 30px;
  border-radius: 11px;
  background: rgba(255, 255, 255, 0.72);
  display: grid;
  place-items: center;
  font-size: 15px;
  flex-shrink: 0;
}

.lesson-card__period {
  font-size: 11px;
  font-weight: 800;
  min-width: 27px;
  height: 27px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  color: #fff;
  font-variant-numeric: tabular-nums;
}

.lesson-card__subject {
  font-weight: 700;
  font-size: clamp(13.5px, 0.8vw, 14.5px);
  flex: 1;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.lesson-card__time {
  font-size: var(--fs-xs);
  color: var(--sub);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.lesson-card__hw {
  font-size: var(--fs-xs);
  color: var(--sub);
  background: var(--surface-2);
  border-radius: 10px;
  padding: 5px 9px;
  margin-top: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
  overflow: hidden;
}
.lesson-card__hw span {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.lesson-card__hw--none {
  color: #A9C7B4;
  background: transparent;
  padding-inline-start: 2px;
}

.lesson-card__badge {
  position: absolute;
  top: -8px;
  inset-inline-end: 10px;
  font-size: 10px;
  font-weight: 800;
  padding: 2px 9px;
  border-radius: 999px;
  background: linear-gradient(135deg, var(--pink-deep), #C08080);
  color: #fff;
  box-shadow: var(--shadow-xs);
  animation: badge-pop 0.4s var(--ease-spring);
}

/* هویت رنگی درس‌ها */
.sub-lavender { background: var(--lavender); }
.sub-lavender .lesson-card__period { background: var(--lavender-deep); }
.sub-lavender:hover { background: #E8EFF8; }

.sub-blue { background: var(--blue); }
.sub-blue .lesson-card__period { background: var(--blue-deep); }
.sub-blue:hover { background: #E8F0FB; }

.sub-mint { background: var(--mint); }
.sub-mint .lesson-card__period { background: var(--mint-deep); }
.sub-mint:hover { background: #E8F7EE; }

.sub-pink { background: var(--pink); }
.sub-pink .lesson-card__period { background: var(--pink-deep); }
.sub-pink:hover { background: #F7E9E9; }

.sub-cream { background: var(--cream); }
.sub-cream .lesson-card__period { background: var(--cream-deep); }
.sub-cream:hover { background: #FFF5E3; }

.sub-green { background: var(--green); }
.sub-green .lesson-card__period { background: var(--green-deep); }
.sub-green:hover { background: #EDF6E3; }

/* حالت خالی روز */
.day-empty {
  margin: auto 0;
  text-align: center;
  color: var(--sub);
  padding: 26px 8px;
  font-size: var(--fs-sm);
}
.day-empty .face { font-size: 31px; display: block; margin-bottom: 8px; opacity: 0.85; }

/* ---------- اسکلتون بارگذاری ---------- */
.skeleton {
  position: relative;
  overflow: hidden;
  background: var(--surface-2);
  border-radius: var(--radius-md);
}
.skeleton::after {
  content: '';
  position: absolute;
  inset: 0;
  transform: translateX(100%);
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.75), transparent);
  animation: shimmer 1.4s infinite;
}

/* ================================================================
   مهلت‌ها
   ================================================================ */
.tasks-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(clamp(250px, 26vw, 300px), 1fr));
  gap: clamp(10px, 1.4vw, 16px);
}

.task-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: clamp(14px, 1.4vw, 18px) clamp(15px, 1.5vw, 19px);
  cursor: pointer;
  text-align: right;
  transition: transform 0.25s var(--ease-out), box-shadow 0.25s, border-color 0.25s;
  font-family: inherit;
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 8px;
  position: relative;
  color: var(--text);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
.task-card::before {
  content: '';
  position: absolute;
  top: 0;
  inset-inline: 0;
  height: 4px;
  background: var(--border);
}
.task-card--high::before { background: linear-gradient(90deg, var(--pink-deep), var(--cream-deep)); }
.task-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); }
.task-card:focus-visible { outline: 3px solid var(--lavender); outline-offset: 2px; }

.task-card__kind {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  align-self: flex-start;
  font-size: var(--fs-xs);
  font-weight: 700;
  padding: 3px 12px;
  border-radius: 999px;
  background: var(--surface-2);
  border: 1px solid var(--border);
}

.task-card__title {
  font-weight: 800;
  font-size: clamp(14.5px, 1vw, 16px);
  margin: 0;
  line-height: 1.6;
}

.task-card__subject { color: var(--sub); font-size: var(--fs-sm); }

.task-card__footer {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 4px;
  flex-wrap: wrap;
}

.countdown-chip {
  font-size: var(--fs-xs);
  font-weight: 800;
  padding: 4px 13px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
}

.cd-today { background: #FBE3E3; color: #B84A4A; animation: pulse-soft 2s infinite; }
.cd-tomorrow { background: var(--cream); color: var(--cream-deep); }
.cd-soon { background: var(--cream); color: var(--cream-deep); }
.cd-future { background: var(--mint); color: var(--mint-deep); }
.cd-passed { background: var(--surface-2); color: var(--sub); }

.task-card__due { font-size: var(--fs-xs); color: var(--sub); }

.priority-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  flex-shrink: 0;
}
.priority-high { background: #E58B8B; box-shadow: 0 0 0 3px rgba(229, 139, 139, 0.25); }
.priority-normal { background: var(--cream-deep); box-shadow: 0 0 0 3px rgba(192, 138, 62, 0.18); }
.priority-low { background: var(--mint-deep); box-shadow: 0 0 0 3px rgba(78, 158, 120, 0.18); }

.attach-chip {
  font-size: var(--fs-xs);
  color: var(--sub);
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: var(--surface-2);
  border-radius: 999px;
  padding: 3px 10px;
  white-space: nowrap;
}

/* ================================================================
   اطلاعیه‌ها
   ================================================================ */
.ann-list { display: flex; flex-direction: column; gap: 11px; max-width: 900px; }

.ann-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: clamp(13px, 1.3vw, 17px) clamp(15px, 1.8vw, 20px);
  cursor: pointer;
  text-align: right;
  transition: transform 0.22s, box-shadow 0.22s, border-color 0.22s;
  font-family: inherit;
  width: 100%;
  color: var(--text);
  position: relative;
  -webkit-tap-highlight-color: transparent;
}
.ann-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-soft); border-color: var(--border-strong); }
.ann-card:focus-visible { outline: 3px solid var(--lavender); outline-offset: 2px; }

.ann-card--pinned {
  background: linear-gradient(120deg, rgba(249, 221, 231, 0.35), var(--surface) 55%);
  border-color: rgba(176, 106, 106, 0.35);
}

.ann-card__head { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }

.ann-card__pin {
  font-size: var(--fs-xs);
  background: var(--pink);
  color: var(--pink-deep);
  padding: 2px 11px;
  border-radius: 999px;
  font-weight: 800;
  white-space: nowrap;
}

.ann-card__title { font-weight: 700; font-size: clamp(14px, 1vw, 15.5px); margin: 0; flex: 1; min-width: 140px; }

.ann-card__body {
  color: var(--sub);
  font-size: var(--fs-sm);
  margin: 7px 0 0;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.ann-card__date { font-size: var(--fs-xs); color: var(--sub); margin-top: 7px; display: inline-block; }

/* ================================================================
   پنل جزئیات: سایدبار دسکتاپ / بات‌شیت موبایل
   ================================================================ */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(55, 40, 75, 0.4);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  opacity: 0;
  transition: opacity 0.28s;
}

.overlay--open { opacity: 1; }

.sheet {
  background: var(--surface);
  border-radius: var(--radius-xl);
  width: min(560px, 100%);
  max-height: min(86vh, 780px);
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow-pop);
  transform: translateY(16px) scale(0.97);
  opacity: 0;
  transition: transform 0.34s var(--ease-spring), opacity 0.26s;
  overflow: hidden;
}

.overlay--open .sheet { transform: none; opacity: 1; }

.sheet__grip {
  display: none;
  width: 46px;
  height: 5px;
  border-radius: 999px;
  background: var(--border-strong);
  margin: 11px auto 0;
  flex-shrink: 0;
  cursor: grab;
  touch-action: none;
}
.sheet__grip:active { cursor: grabbing; }

.sheet__head {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: clamp(16px, 2vw, 20px) clamp(18px, 2.4vw, 24px) 13px;
  border-bottom: 1px solid var(--border);
}

.sheet__title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(17px, 1.3vw, 21px);
  margin: 0;
  color: #333B52;
  line-height: 1.6;
}

.sheet__close {
  margin-inline-start: auto;
  width: 36px;
  height: 36px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  cursor: pointer;
  font-size: 15px;
  color: var(--sub);
  display: grid;
  place-items: center;
  flex-shrink: 0;
  transition: background 0.25s, color 0.25s, transform 0.35s var(--ease-spring);
}
.sheet__close:hover { background: var(--pink); color: var(--pink-deep); transform: rotate(90deg); }

.sheet__body { padding: clamp(16px, 2vw, 20px) clamp(18px, 2.4vw, 24px) 26px; overflow-y: auto; overscroll-behavior: contain; }

/* دسکتاپ: پنل کناری */
@media (min-width: 769px) {
  .overlay { justify-content: flex-start; padding: 0; }
  .sheet {
    width: min(480px, 94vw);
    max-height: 100vh;
    height: 100vh;
    border-radius: var(--radius-xl) 0 0 var(--radius-xl);
    transform: translateX(-46px);
    transition: transform 0.36s var(--ease-spring), opacity 0.26s;
  }
  .overlay--open .sheet { transform: none; }
}

/* موبایل: بات‌شیت با قابلیت درگ */
@media (max-width: 768px) {
  .overlay { align-items: flex-end; padding: 0; }
  .sheet {
    width: 100%;
    max-height: 88vh;
    border-radius: var(--radius-xl) var(--radius-xl) 0 0;
    transform: translateY(100%);
    transition: transform 0.36s var(--ease-spring);
    will-change: transform;
  }
  .overlay--open .sheet { transform: none; }
  .sheet__grip { display: block; }
  .sheet--dragging { transition: none; }
}

/* ---------- محتوای جزئیات ---------- */
.detail-lesson { display: flex; flex-direction: column; gap: 14px; }

.detail-hero {
  border-radius: var(--radius-lg);
  padding: clamp(14px, 1.6vw, 18px) clamp(15px, 1.8vw, 19px);
  display: flex;
  align-items: center;
  gap: 14px;
  position: relative;
  overflow: hidden;
}
.detail-hero::after {
  content: '';
  position: absolute;
  width: 130px;
  height: 130px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,0.55), transparent 70%);
  top: -45%;
  inset-inline-end: -8%;
  pointer-events: none;
}

.detail-hero__period {
  min-width: 50px;
  height: 50px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.78);
  color: var(--text);
  font-weight: 800;
  font-size: clamp(13px, 1vw, 15px);
  display: grid;
  place-items: center;
  text-align: center;
  padding: 0 8px;
  box-shadow: var(--shadow-xs);
  font-family: var(--font-display);
  font-weight: 700;
}

.detail-hero__subject {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(19px, 1.5vw, 23px);
  margin: 0;
  color: #333B52;
}

.detail-hero__meta { font-size: var(--fs-sm); color: var(--sub); }

.detail-block {
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 13px 16px;
  background: var(--surface);
}
.detail-block + .detail-block { margin-top: 10px; }
.detail-block__title {
  font-size: var(--fs-sm);
  font-weight: 800;
  color: var(--lavender-deep);
  margin: 0 0 7px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.detail-block__text { margin: 0; font-size: var(--fs-base); white-space: pre-wrap; word-break: break-word; }
.detail-block__text--muted { color: #A9C7B4; }

.dl-row {
  display: flex;
  gap: 10px;
  padding: 8px 0;
  font-size: var(--fs-sm);
  border-bottom: 1px dashed var(--border);
}
.dl-row:last-child { border-bottom: 0; }
.dl-row dt { color: var(--sub); min-width: 112px; flex-shrink: 0; }
.dl-row dd { margin: 0; font-weight: 600; }

.attachment-list { display: flex; flex-direction: column; gap: 8px; }

.attachment-item {
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  border-radius: var(--radius-sm);
  padding: 10px 13px;
  color: var(--text);
  transition: border-color 0.2s, background 0.2s, transform 0.2s;
}
.attachment-item:hover { border-color: var(--lavender); background: #F6F1FB; text-decoration: none; transform: translateX(-3px); }

.attachment-item__icon { font-size: 19px; }
.attachment-item__name { font-size: var(--fs-sm); font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.attachment-item__size { font-size: var(--fs-xs); color: var(--sub); white-space: nowrap; }

/* ================================================================
   فرم‌ها و دکمه‌ها
   ================================================================ */
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 15px; }
.field__label { font-size: var(--fs-sm); font-weight: 700; }
.field__hint { font-size: var(--fs-xs); color: var(--sub); }
.field__req { color: var(--pink-deep); }

.input, .select, .textarea {
  font-family: inherit;
  font-size: var(--fs-base);
  color: var(--text);
  background: var(--surface);
  border: 1.5px solid var(--border-strong);
  border-radius: var(--radius-sm);
  padding: 11px 15px;
  transition: border-color 0.2s, box-shadow 0.2s;
  width: 100%;
  min-height: 46px;
}
.input:focus, .select:focus, .textarea:focus {
  outline: none;
  border-color: var(--lavender-deep);
  box-shadow: 0 0 0 4px rgba(233, 221, 248, 0.5);
}

.textarea { resize: vertical; min-height: 96px; }

.input--time { direction: ltr; text-align: center; font-variant-numeric: tabular-nums; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-family: inherit;
  font-size: var(--fs-sm);
  font-weight: 700;
  border-radius: 14px;
  padding: 12px 24px;
  min-height: 46px;
  cursor: pointer;
  border: 1.5px solid transparent;
  transition: transform 0.18s var(--ease-spring), box-shadow 0.25s, background 0.25s, color 0.25s;
  position: relative;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
.btn:active { transform: scale(0.96); }
.btn:focus-visible { outline: 3px solid var(--lavender); outline-offset: 2px; }
.btn[disabled] { opacity: 0.55; cursor: not-allowed; }

.btn--primary {
  background: linear-gradient(135deg, var(--lavender-deep), var(--blue-deep));
  color: #fff;
  box-shadow: 0 6px 18px rgba(76, 110, 158, 0.32);
}
.btn--primary::after {
  content: '';
  position: absolute;
  top: 0;
  inset-inline-start: -80%;
  width: 50%;
  height: 100%;
  background: linear-gradient(105deg, transparent, rgba(255,255,255,0.35), transparent);
  transform: skewX(-20deg);
  transition: inset-inline-start 0.6s;
  pointer-events: none;
}
.btn--primary:hover { box-shadow: 0 8px 26px rgba(76, 110, 158, 0.45); transform: translateY(-1px); }
.btn--primary:hover::after { inset-inline-start: 130%; }

.btn--ghost { background: var(--surface); border-color: var(--border-strong); color: var(--text); }
.btn--ghost:hover { background: var(--surface-2); }

.btn--danger { background: #FDECEC; color: #B84A4A; border-color: #F3CFCF; }
.btn--danger:hover { background: #F9DCDC; }

.btn--sm { padding: 8px 15px; font-size: var(--fs-xs); border-radius: 11px; min-height: 38px; }

.btn-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* دکمه شناور «امروز» */
.fab-today {
  position: fixed;
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  inset-inline-start: 18px;
  z-index: 70;
  border: none;
  border-radius: 999px;
  padding: 12px 22px;
  font-family: var(--font-display);
  font-size: 15px;
  color: #fff;
  background: linear-gradient(135deg, var(--lavender-deep), var(--blue-deep));
  box-shadow: var(--shadow-pop);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  opacity: 0;
  transform: translateY(70px) scale(0.85);
  transition: opacity 0.35s, transform 0.35s var(--ease-spring);
  pointer-events: none;
}
.fab-today--visible { opacity: 1; transform: none; pointer-events: auto; }
.fab-today:active { transform: scale(0.93); }
@media (min-width: 1360px) { .fab-today { display: none; } }

/* ---------- توست ---------- */
.toast-region {
  position: fixed;
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  inset-inline-start: 50%;
  transform: translateX(50%);
  z-index: 300;
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
  pointer-events: none;
  width: min(92vw, 430px);
}

.toast {
  pointer-events: auto;
  background: var(--text);
  color: #FBF9FC;
  border-radius: 15px;
  padding: 12px 22px;
  font-size: var(--fs-sm);
  box-shadow: var(--shadow-pop);
  display: flex;
  align-items: center;
  gap: 9px;
  animation: toast-in 0.4s var(--ease-spring);
  max-width: 100%;
}
.toast--success { background: #3E7D5E; }
.toast--error { background: #B84A4A; }

/* ---------- حالت‌های خالی و خطا ---------- */
.empty-state {
  text-align: center;
  color: var(--sub);
  padding: clamp(30px, 4vw, 46px) 20px;
  background: var(--surface);
  border: 2px dashed var(--border-strong);
  border-radius: var(--radius-lg);
  font-size: var(--fs-base);
}
.empty-state .face { font-size: clamp(34px, 4vw, 42px); display: block; margin-bottom: 10px; }

.error-state {
  background: #FDF1F3;
  border: 1px solid #F3D3DA;
  color: #A0455A;
  padding: 16px 20px;
  border-radius: var(--radius-lg);
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: var(--fs-sm);
}

.muted { color: var(--sub); }
.small { font-size: var(--fs-xs); }

/* ---------- پنل اعلان‌ها ---------- */
.notifications-panel {
  position: absolute;
  top: calc(100% + 10px);
  inset-inline-end: 0;
  width: min(370px, calc(100vw - 24px));
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-pop);
  padding: 8px;
  z-index: 90;
  max-height: min(430px, 70vh);
  overflow-y: auto;
  animation: fade-up 0.28s var(--ease-out);
}

.notif-item {
  display: flex;
  gap: 11px;
  padding: 11px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  text-align: right;
  width: 100%;
  background: transparent;
  border: none;
  font-family: inherit;
  color: var(--text);
  transition: background 0.15s;
}
.notif-item:hover { background: var(--surface-2); }

.notif-item__icon {
  font-size: 19px;
  flex-shrink: 0;
  width: 38px;
  height: 38px;
  border-radius: 12px;
  background: var(--surface-2);
  display: grid;
  place-items: center;
}
.notif-item__title { font-size: var(--fs-sm); font-weight: 700; text-align: right; }
.notif-item__sub { font-size: var(--fs-xs); color: var(--sub); text-align: right; }

.hidden { display: none !important; }

.visually-hidden {
  position: absolute;
  width: 1px; height: 1px;
  margin: -1px; padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

/* ---------- فوتر ---------- */
.site-footer {

  <script>
// Persian (Jalali) calendar utilities — dependency-free conversion.
// Algorithm: the standard jalali_to_gregorian / gregorian_to_jalali pair
// used widely (based on the work by Kazimierz M. Borkowski / jalaali-js logic,
// re-implemented here so the bundle stays tiny).

const PERSIAN_DIGITS = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];

/** Convert Latin digits to Persian digits. */
function faDigits(input) {
  return String(input).replace(/[0-9]/g, (d) => PERSIAN_DIGITS[Number(d)]);
}

/** Convert Persian/Arabic digits back to Latin for <input> parsing. */
function toLatinDigits(input) {
  return input
    .replace(/[\u06F0-\u06F9]/g, (ch) => String(ch.charCodeAt(0) - 0x06F0))
    .replace(/[\u0660-\u0669]/g, (ch) => String(ch.charCodeAt(0) - 0x0660));
}

function div(a, b) {
  return Math.floor(a / b);
}

/** Gregorian y/m/d numbers -> Jalali (timezone-safe core) */
function toJalaliParts(gy, gm, gd) {
  const g_d_m = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
  let jy = gy <= 1600 ? 0 : 979;
  const gy2 = gy <= 1600 ? gy - 621 : gy - 1600;
  const gm2 = gm > 2 ? 1 : 0;
  let days = (365 * gy2) + div(gy2 + 3, 4) - div(gy2 + 99, 100)
    + div(gy2 + 399, 400) - 80 + gd + g_d_m[gm - 1];
  days += (((gy2 % 4 === 0 && gy2 % 100 !== 0) || gy2 % 400 === 0) && gm > 2) ? 1 : 0;
  let jy2 = jy + 33 * div(days, 12053);
  days %= 12053;
  jy2 += 4 * div(days, 1461);
  days %= 1461;
  if (days > 365) {
    jy2 += div(days - 1, 365);
    days = (days - 1) % 365;
  }
  const jm = days < 186 ? 1 + div(days, 31) : 7 + div(days - 186, 30);
  const jd = 1 + ((days < 186) ? (days % 31) : ((days - 186) % 30));
  jy = jy2;
  return { jy, jm, jd };
}

/** Gregorian -> Jalali */
function toJalali(date) {
  return toJalaliParts(date.getFullYear(), date.getMonth() + 1, date.getDate());
}

/** Jalali -> Gregorian (returns a Date at local noon for safety) */
function fromJalali(jy, jm, jd) {
  let gy = jy <= 979 ? 621 : 1600;
  const jy2 = jy <= 979 ? jy : jy - 979;
  let days = (365 * jy2) + div(jy2, 33) * 8 + div((jy2 % 33) + 3, 4)
    + 78 + jd + ((jm < 7) ? (jm - 1) * 31 : ((jm - 7) * 30) + 186);
  gy += 400 * div(days, 146097);
  days %= 146097;
  if (days > 36524) {
    gy += 100 * div(--days, 36524);
    days %= 36524;
    if (days >= 365) days++;
  }
  gy += 4 * div(days, 1461);
  days %= 1461;
  if (days > 365) {
    gy += div(days - 1, 365);
    days = (days - 1) % 365;
  }
  let gd = days + 1;
  const sal_a = [0, 31, ((gy % 4 === 0 && gy % 100 !== 0) || (gy % 400 === 0)) ? 29 : 28,
    31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
  let gm = 0;
  for (gm = 1; gm <= 12; gm++) {
    if (gd <= sal_a[gm]) break;
    gd -= sal_a[gm];
  }
  const d = new Date(gy, gm - 1, gd, 12, 0, 0);
  return d;
}

const JALALI_MONTHS = [
  'فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور',
  'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند',
];

// Iran week: Saturday=0 ... Friday=6 (JS: Sunday=0 ... Saturday=6)
const WEEK_DAY_NAMES = ['شنبه', 'یکشنبه', 'دوشنبه', 'سه‌شنبه', 'چهارشنبه', 'پنجشنبه', 'جمعه'];

/** Convert JS getDay() (Sun=0) to Iran day index (Sat=0). */
function iranDayIndex(date) {
  return (date.getDay() + 1) % 7;
}

/* ---------- زمان تهران (UTC+3:30، بدون ساعت تابستانی از ۲۰۲۲) ---------- */

/** y/m/d در تقویم تهران برای یک لحظه‌ی زمانی */
function tehranYMD(ms) {
  const t = new Date(ms + 3.5 * 3600_000);
  return { y: t.getUTCFullYear(), m: t.getUTCMonth() + 1, d: t.getUTCDate() };
}

/** شماره‌ی روز تهران (روز سپری‌شده از epoch به وقت تهران) */
function tehranDayNumber(ms = Date.now()) {
  const { y, m, d } = tehranYMD(ms);
  return Math.floor(Date.UTC(y, m - 1, d) / 86_400_000);
}

/** ساعت تهران «HH:MM» برای یک لحظه‌ی زمانی */
function tehranHHMM(ms) {
  const t = new Date(ms + 3.5 * 3600_000);
  return `${String(t.getUTCHours()).padStart(2, '0')}:${String(t.getUTCMinutes()).padStart(2, '0')}`;
}

/**
 * پنجره‌ی غلتان n روزه از «امروزِ تهران».
 * همیشه از امروز شروع می‌شود و هرگز روز گذشته نشان نمی‌دهد.
 * خروجی: آرایه‌ای از { date, dayIdx } — date نونِ روز محلی است.
 */
function rollingWindow(n, now = Date.now()) {
  const { y, m, d } = tehranYMD(now);
  const out = [];
  for (let i = 0; i < n; i++) {
    const date = new Date(y, m - 1, d + i, 12, 0, 0); // نونِ محلی: امن برای DST نبودن
    out.push({ date, dayIdx: iranDayIndex(date) });
  }
  return out;
}

/** Format a Jalali date like «۱۸ آبان ۱۴۰۵». */
function formatJalali(date, opts = {}) {
  const { jy, jm, jd } = toJalali(date);
  const parts = [];
  if (opts.withWeekday) parts.push(WEEK_DAY_NAMES[iranDayIndex(date)]);
  parts.push(faDigits(jd), JALALI_MONTHS[jm - 1]);
  if (opts.withYear !== false) parts.push(faDigits(jy));
  return parts.join(' ');
}

/** Format an ISO datetime for Tehran timezone, Jalali. */
function formatJalaliDateTime(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return '—';
  const tehran = new Date(d.getTime() + (3.5 * 3600_000));
  const { jy, jm, jd } = toJalali(tehran);
  const hh = String(tehran.getUTCHours()).padStart(2, '0');
  const mm = String(tehran.getUTCMinutes()).padStart(2, '0');
  return `${faDigits(jd)} ${JALALI_MONTHS[jm - 1]} ${faDigits(jy)}، ساعت ${faDigits(hh + ':' + mm)}`;
}

/** فقط بخش تاریخ شمسی یک ISO به وقت تهران: «۱۸ آبان» */
function jalaliDateOnly(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return '—';
  const { jy, jm, jd } = toJalali(new Date(d.getTime() + 3.5 * 3600_000));
  return `${faDigits(jd)} ${JALALI_MONTHS[jm - 1]}`;
}

/** Format HH:MM with Persian digits. */
function faTime(hhmm) {
  if (!hhmm) return '—';
  return faDigits(hhmm);
}

/** Relative countdown in Persian: «۳ روز مانده», «امروز», «فردا», «گذشته» … */
function countdown(iso) {
  const target = new Date(iso).getTime();
  const now = Date.now();
  const diff = target - now;
  if (diff < 0) return { text: 'مهلت گذشته', state: 'passed' };
  // Tehran day number (UTC+3:30, no DST since 2022): shift then floor to days
  const tehranDay = (ms) => Math.floor((ms + 3.5 * 3600_000) / 86_400_000);
  const daysAhead = tehranDay(target) - tehranDay(now);
  if (daysAhead === 0) return { text: 'امروز!', state: 'today' };
  if (daysAhead === 1) return { text: 'فردا', state: 'tomorrow' };
  const hours = diff / 3600_000;
  if (hours < 1) return { text: `${faDigits(Math.max(1, Math.round(hours * 60)))} دقیقه مانده`, state: 'soon' };
  if (hours < 24) return { text: `${faDigits(Math.round(hours))} ساعت مانده`, state: 'soon' };
  return { text: `${faDigits(daysAhead)} روز مانده`, state: 'future' };
}

// شنبه تا چهارشنبه: ۴ زنگ (۰۷:۴۵ تا ۱۳:۴۵)
// دوشنبه: ۳ زنگ (پایان ۱۲:۱۵)

// زنگ‌های ۷۵ دقیقه‌ای با تفریح‌های ۱۵ و ۳۰ دقیقه‌ای (ناهار)

const PERIODS_NORMAL = 4;
const PERIODS_MONDAY = 3;

/** بازه‌ی زمانی استاندارد زنگ‌ها [شروع, پایان] */
const PERIOD_TABLE = [
  ['07:45', '09:00'],
  ['09:15', '10:30'],
  ['11:00', '12:15'],
  ['12:30', '13:45'],
];

/** روزهای کلاس‌دار (0=شنبه … 4=چهارشنبه) */
const CLASS_DAYS = [0, 1, 2, 3, 4];

/** تعداد زنگ‌های یک روز هفته (0=شنبه … 6=جمعه) */
function periodsPerDay(day) {
  if (day === 2) return PERIODS_MONDAY; // دوشنبه
  if (day === 5 || day === 6) return 0; // پنجشنبه و جمعه: تعطیل
  return PERIODS_NORMAL;
}

/** بازه زمانی استاندارد یک زنگ: [شروع, پایان] */
function periodTimes(day, period) {
  return PERIOD_TABLE[Math.min(period, 4) - 1];
}

/**

 * زنگ‌های گردشی (alt_subject_id) بر اساس تعداد هفته‌های گذشته از نقطه مبنا
 * هفته‌به‌هفته بین درس اصلی و درس دوم عوض می‌شوند.
 */
const ROTATION_EPOCH_MS = Date.UTC(2026, 10, 21); // مبنا: شنبه ۱۴۰۵/۰۹/۰۱ — زنگ اولِ هفته
function resolveSubject(lesson, dateMs) {
  if (!lesson.alt_subject_id || !lesson.alt_subject_name) {
    return {
      subject_name: lesson.subject_name,
      color_key: lesson.color_key,
      rotating: false,
    };
  }
  const week = Math.floor((dateMs - ROTATION_EPOCH_MS) / (7 * 86_400_000));
  const useAlt = week % 2 === 1;
  return {
    subject_name: useAlt ? lesson.alt_subject_name : lesson.subject_name,
    color_key: useAlt ? lesson.alt_color_key : lesson.color_key,
    rotating: true,
  };
}

// ---------- API (مقاوم به شبکه ضعیف) ----------
// هر درخواست: مهلت زمانی + تلاش مجدد خودکار — روی شبکه‌ای که پکت می‌اندازد،
// یک fetch ساده ممکن است تا ابد معطل بماند و صفحه «نصفه» بماند.
const API_TIMEOUT_MS = 12_000;
const API_RETRIES = 2;

function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }

async function fetchOnce(path, timeoutMs) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    return await fetch(path, { headers: { Accept: 'application/json' }, signal: ctrl.signal });
  } finally {
    clearTimeout(timer);
  }
}

async function api(path) {
  let lastErr;
  for (let attempt = 0; attempt <= API_RETRIES; attempt++) {
    try {
      const res = await fetchOnce(path, API_TIMEOUT_MS);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return await res.json();
    } catch (err) {
      lastErr = err;
      // فقط خطای شبکه/مهلت را دوباره امتحان می‌کنیم، نه پاسخ‌های معتبر سرور را
      if (attempt < API_RETRIES && (err.name === 'AbortError' || err.name === 'TypeError')) {
        await sleep(700 * (attempt + 1)); // فاصله کوتاه قبل از تلاش مجدد
        continue;
      }
      throw lastErr;
    }
  }
  throw lastErr;
}

// ---------- ابزار DOM ----------
function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') node.className = v;
    else if (k === 'text') node.textContent = v;
    else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined) node.setAttribute(k, String(v));
  }
  for (const child of children) {
    if (child === null || child === undefined) continue;
    node.append(child);
  }
  return node;
}

function toast(msg, type = 'info') {
  const t = el('div', { class: `toast toast--${type}`, text: msg });
  $('#toastRegion').append(t);
  setTimeout(() => {
    t.style.transition = 'opacity .4s, transform .4s';
    t.style.opacity = '0';
    t.style.transform = 'translateY(10px)';
    setTimeout(() => t.remove(), 400);
  }, 3200);
}

function formatSize(bytes) {
  if (bytes >= 1_048_576) return `${faDigits((bytes / 1_048_576).toFixed(1))} مگابایت`;
  if (bytes >= 1024) return `${faDigits(Math.round(bytes / 1024))} کیلوبایت`;
  return `${faDigits(bytes)} بایت`;
}

/** درس بعدیِ امروز را پیدا می‌کند (بر اساس ساعت فعلی تهران) */
function nextLessonToday() {
  const todayIdx = iranDayIndex(new Date());
  const lessons = (state.days[todayIdx] || [])
    .filter((l) => l.period <= (periodsPerDay(todayIdx) || 12));
  if (!lessons.length) return null;
  const hhmm = tehranHHMM(Date.now());
  const resolved = lessons.map((l) => ({ lesson: l, subj: resolveSubject(l, Date.now()) }));
  const next = resolved.find((r) => r.lesson.start_time > hhmm);
  return next ? { ...next.lesson, subject_name: next.subj.subject_name } : null;
}

function renderDots(windowDays, todayKey) {
  const dots = $('#ttDots');
  dots.textContent = '';
  for (const { date, dayIdx } of windowDays) {
    const isToday = date.toDateString() === todayKey;
    dots.append(el('button', {
      class: `tt-dot${isToday ? ' tt-dot--today' : ''}`,
      type: 'button',
      'data-day': dayIdx,
      'data-date': date.toISOString().slice(0, 10),
      'aria-label': WEEK_DAY_NAMES[dayIdx],
      onclick: () => scrollToDay(dayIdx, date.toISOString().slice(0, 10)),
    }));
  }
  updateDots();
}

function updateDots() {
  const scroll = $('#ttScroll');
  const cols = [...document.querySelectorAll('.day-col')];
  if (!cols.length) return;
  const center = scroll.scrollLeft + scroll.clientWidth / 2;
  let closest = null;
  let closestDist = Infinity;
  for (const col of cols) {
    const c = col.offsetLeft + col.offsetWidth / 2;
    const dist = Math.abs(c - center);
    if (dist < closestDist) { closestDist = dist; closest = col; }
  }
  const closestDay = closest?.dataset.day ?? '0';
  const closestDate = closest?.dataset.date ?? '';
  for (const dot of document.querySelectorAll('.tt-dot')) {
    dot.classList.toggle('tt-dot--active', dot.dataset.day === closestDay && dot.dataset.date === closestDate);
  }
}

function updateScrollState() {
  const wrap = $('#ttWrap');
  const scroll = $('#ttScroll');
  const scrollable = scroll.scrollWidth > scroll.clientWidth + 4;
  wrap.classList.toggle('tt-wrap--scrollable', scrollable);
  // در RTL مقدار scrollLeft از 0 تا منفی می‌رود (استاندارد جدید مرورگرها)
  const pos = Math.abs(scroll.scrollLeft);
  const max = scroll.scrollWidth - scroll.clientWidth;
  const atStart = pos <= 4;
  const atEnd = pos >= max - 4;
  wrap.classList.toggle('tt-wrap--at-start', atStart);
  wrap.classList.toggle('tt-wrap--at-end', atEnd);
  $('#ttPrev').disabled = atStart;
  $('#ttNext').disabled = atEnd;
}

function scrollToDay(dayIdx, dateKey, smooth = true) {
  const scroll = $('#ttScroll');
  const sel = dateKey
    ? `.day-col[data-day="${dayIdx}"][data-date="${dateKey}"]`
    : `.day-col[data-day="${dayIdx}"]`;
  const col = document.querySelector(sel);
  if (!col || !scroll) return;
  // با getBoundingClientRect (قابل‌اعتماد در RTL): ستون باید به وسط دید بیاید.
  // در RTL مقادیر scrollLeft از 0 (راست) تا منفی (چپ) می‌رود.
  // delta = فاصله ستون از مرکز (مثبت: ستون سمت راست است)؛
  // اسکرول لازم همان delta است (اگر ستون راست‌تر است، به چپ یعنی منفی می‌رویم).
  const rect = col.getBoundingClientRect();
  const sRect = scroll.getBoundingClientRect();
  const delta = (rect.left + rect.width / 2) - (sRect.left + scroll.clientWidth / 2);
  scroll.scrollBy({ left: delta, behavior: smooth ? 'smooth' : 'auto' });
}

function scrollToToday(smooth = true) {
  // اولین ستونِ «امروز» (اولین ستون پنجره)
  const scroll = $('#ttScroll');
  if (!scroll) return;
  const col = scroll.querySelector('.day-col');
  if (!col) return;
  const rect = col.getBoundingClientRect();
  const sRect = scroll.getBoundingClientRect();
  const delta = (rect.left + rect.width / 2) - (sRect.left + scroll.clientWidth / 2);
  scroll.scrollBy({ left: delta, behavior: smooth ? 'smooth' : 'auto' });
}

// ---------- پنل جزئیات ----------
let lastFocused = null;

function openOverlay(overlay) {
  lastFocused = document.activeElement;
  overlay.hidden = false;
  requestAnimationFrame(() => overlay.classList.add('overlay--open'));
  document.body.style.overflow = 'hidden';
  document.addEventListener('keydown', overlayKeydown, true);
}

function closeOverlay(overlay) {
  overlay.classList.remove('overlay--open');
  document.body.style.overflow = '';
  document.removeEventListener('keydown', overlayKeydown, true);
  setTimeout(() => { overlay.hidden = true; }, 360);
  if (lastFocused && lastFocused.focus) lastFocused.focus();
}

function overlayKeydown(e) {
  if (e.key === 'Escape') {
    closeOverlay($('#detailOverlay'));
  }
  if (e.key === 'Tab') {
    const overlay = $('#detailOverlay');
    const focusables = overlay.querySelectorAll('button, a[href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
    if (!focusables.length) return;
    const first = focusables[0];
    const last = focusables[focusables.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
}

// ---------- درگ بات‌شیت (موبایل) ----------
function setupSheetDrag() {
  const grip = $('#detailGrip');
  const sheet = $('#detailSheet');
  const overlay = $('#detailOverlay');
  let startY = 0;
  let dragging = false;
  let curY = 0;

  function onStart(e) {
    if (window.innerWidth > 768) return;
    dragging = true;
    startY = e.touches ? e.touches[0].clientY : e.clientY;
    sheet.classList.add('sheet--dragging');
  }
  function onMove(e) {
    if (!dragging) return;
    curY = (e.touches ? e.touches[0].clientY : e.clientY) - startY;
    if (curY < 0) curY = 0;
    sheet.style.transform = `translateY(${curY}px)`;
    overlay.style.opacity = String(Math.max(0.25, 1 - curY / 400));
  }
  function onEnd() {
    if (!dragging) return;
    dragging = false;
    sheet.classList.remove('sheet--dragging');
    sheet.style.transform = '';
    overlay.style.opacity = '';
    if (curY > 110) closeOverlay(overlay);
  }
  grip.addEventListener('touchstart', onStart, { passive: true });
  grip.addEventListener('touchmove', onMove, { passive: true });
  grip.addEventListener('touchend', onEnd);
  grip.addEventListener('mousedown', onStart);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onEnd);
}

async function loadAll() {
  setConnState('loading');
  let data = null;
  try {
    // یک درخواست واحد به‌جای ۴ درخواست جدا — نصف شدن صفحه روی شبکه ضعیف
    // معمولاً از قطره‌شدن یکی از درخواست‌های موازی بود.
    data = await api('/api/bootstrap');
  } catch (err) {
    setConnState('error');
    // تلاش مجدد خودکار هر ۸ ثانیه تا وقتی جواب بیاید
    setTimeout(loadAll, 8_000);
    return;
  }
  setConnState('ok');

  state.days = data.days ?? [];
  state.tasks = { active: data.tasks?.active ?? [], expired: data.tasks?.expired ?? [] };
  state.announcements = data.announcements ?? [];
  state.settings = data.settings ?? {};

  renderHeader();
  renderHero();
  renderTimetable();
  renderTasks();
  renderAnnouncements();
  renderNotifications();
  // اسکرول به امروز بعد از آنکه layout ستون‌ها کامل شد
  if (window.innerWidth < 1360) {
    requestAnimationFrame(() => requestAnimationFrame(() => scrollToToday(false)));
  }
}

// اتصال رویدادها
$('#detailClose').addEventListener('click', () => closeOverlay($('#detailOverlay')));
$('#detailOverlay').addEventListener('mousedown', (e) => {
  if (e.target === $('#detailOverlay')) closeOverlay($('#detailOverlay'));
});
$('#todayBtn').addEventListener('click', () => scrollToToday());
$('#notifBtn').addEventListener('click', () => toggleNotif());
$('#ttPrev').addEventListener('click', () => {
  const scroll = $('#ttScroll');
  scroll.scrollBy({ left: scroll.clientWidth * 0.8, behavior: 'smooth' });
});
$('#ttNext').addEventListener('click', () => {
  const scroll = $('#ttScroll');
  scroll.scrollBy({ left: -scroll.clientWidth * 0.8, behavior: 'smooth' });
});
$('#ttScroll').addEventListener('scroll', () => {
  updateScrollState();
  updateDots();
}, { passive: true });
window.addEventListener('resize', () => {
  updateScrollState();
  updateDots();
}, { passive: true });
document.addEventListener('click', (e) => {
  const panel = $('#notifPanel');
  if (!panel.classList.contains('hidden')
      && !panel.contains(e.target) && e.target !== $('#notifBtn') && !$('#notifBtn').contains(e.target)) {
    toggleNotif(false);
  }
});
$('#showExpiredBtn').addEventListener('click', () => {
  const grid = $('#expiredGrid');
  const show = grid.style.display === 'none';
  grid.style.display = show ? '' : 'none';
  $('#showExpiredBtn').textContent = show ? 'پنهان کردن آرشیو' : 'آرشیو موارد گذشته';
});

setupSheetDrag();
setupFab();

// به‌روزرسانی شمارش معکوس هر دقیقه
setInterval(() => {
  renderTasks();
  renderNotifications();
  renderHero();
}, 60_000);

loadAll();

</script>
</body>
</html>
